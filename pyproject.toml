[project]
name = "b2-manager-pyzed"
version = "1.0.0"
description = "B2 Cloud Storage Manager with Pyzed UI"
requires-python = ">=3.10"
dependencies = [
    "pyzed-ui",
    "b2sdk",
]

[tool.pyzed]
name = "B2 Manager"
publisher = "MEIRMEIR513"
icon = "icon.png"
windowed = true
targets = ["windows-x64"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
